<!DOCTYPE>
<html lang='pt-br'>
  <head>
    <style>
      .texto{
        color: red;
      }
      .campo{
          border: 1px solid red;

      }
      fielset{
        border: 1px solid red;
        background-color: yellow;

      }
      legend{
        colr:red;

      .botao{
        background-color: red;

     <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
       apiKey: "AIzaSyDsMMFvjl3mwY7dKlLKYzCL_77xD91Sie4",
  authDomain: "maria-eduarda-61bbe.firebaseapp.com",
  projectId: "maria-eduarda-61bbe",
  storageBucket: "maria-eduarda-61bbe.firebasestorage.app",
  messagingSenderId: "755573674020",
  appId: "1:755573674020:web:2d05b3528b1373144448b1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("formulario");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const nome = document.getElementById("nome").value;
      const cep = document.getElementById("cep").value;
      const cpf = document.getElementById("cpf").value;
      const data_de_nascimento = document.getElementById("data de nascimento").value;
      const email = document.getElementById("email").value;
       const foto = document.getElementById("foto").value;
      const idade = document.getElementById("idade").value;
      const rg = document.getElementById("rg").value;
      const senha = document.getElementById("senha").value;
      const telefone = document.getElementById("telefone").value;

      try {
        await addDoc(collection(db, "usuarios"), {
          nome,
          cep,
          cpf,
          data_de_nascimento,
          email,
          foto,
          idade,
          rg,
          senha,
          telefone
        });

        mensagem.textContent = "Usuário salvo com sucesso.";
        mensagem.style.color = "green";
        form.reset();
      } catch (error) {
        mensagem.textContent = "Erro ao salvar: " + error.message;
        mensagem.style.color = "red";
      }
    });
  </script>

  </head>
  <body>
    <form id="formulario">
      <fieldset>
           <legend>Cadastro de Usuario</legend>
        <p class="texto">Nome completo:</p><input typr="text" id="nome" class="campo"placeholder="Nome do usuario" minlegth="10" maxlegth="20" id="nome" class="nome" name="name" required><br>
                <p  class="texto"CPF:</p><input typr="text"   id="cpf" class="campo" placeholder="Nome do usuario" minlegth="10" maxlegth="20" id="nome" class="nome" name="name" required><br>
                  <p  class="texto">CEP:</p><input typr="text"  id="cep" class="campo"placeholder="Nome do usuario" minlegth="10" maxlegth="20" id="nome" class="nome" name="name" required><br>
                  <p  class="texto">DATA DE NASCIMENTO:</p><input typr="text"  id="data_de_nascimento" class="campo" placeholder="Nome do usuario" minlegth="10" maxlegth="20" id="nome" class="nome" name="name" required><br>
                 <p  class="texto"> EMAIL:</p><input typr="text"  id="email" class="campo" placeholder="Nome do usuario" minlegth="10" maxlegth="20" id="nome" class="nome" name="name" required><br>
                 <p  class="texto"> FOTO:</p><input typr="text"  id="foto" class="campo" placeholder="Nome do usuario" minlegth="10" maxlegth="20" id="nome" class="nome" name="name" required><br>
                 <p  class="texto"> IDADE:</p><input typr="text"  id="idade" class="campo" placeholder="Nome do usuario" minlegth="10" maxlegth="20" id="nome" class="nome" name="name" required><br>
                  <p  class="texto">RG:</p><input typr="text"  id="rg" class="campo" placeholder="Nome do usuario" minlegth="10" maxlegth="20" id="nome" class="nome" name="name" required><br>
                 <p  class="texto"> SENHA:</p><input typr="text"  id="senha" class="campo" placeholder="Nome do usuario" minlegth="10" maxlegth="20" id="nome" class="nome" name="name" required><br>
                  <p  class="texto">TELEFONE:</p><input typr="text"  id="telefone"class="campo"placeholder="Nome do usuario" minlegth="10" maxlegth="20" id="nome" class="nome" name="name" required><br>
      <input type="submit" value="cadastrar">
      </fieldset>
  </body>
</html>
